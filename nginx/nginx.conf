events {}

http {
  # 80: только challenge + редирект на https
  server {
    listen 80;
    server_name kursor.site www.kursor.site;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/letsencrypt;
      default_type "text/plain";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # 443: основной сайт
  server {
    listen 443 ssl;
    server_name kursor.site www.kursor.site;

    ssl_certificate     /etc/letsencrypt/live/kursor.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kursor.site/privkey.pem;

    location / {
      proxy_pass http://streamlit:8501/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
